services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ingredia
      POSTGRES_USER: ingredia
      POSTGRES_PASSWORD: ingredia_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingredia -d ingredia"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  postgres_data:
